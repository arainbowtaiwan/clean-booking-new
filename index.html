<script>
    // 🔑 終極連線密鑰：請用滑鼠把雙引號內的中文字全部刪除，貼上你專屬的全新大腦部署網址！
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyiWMIaYxJUdDjIyll0OHtuWiyO0b2aECeSDIJ-G51onfycLjU6VHQdD7JaVAJghybfFw/exec";

    let currentAction = "book";

    const startSelect = document.getElementById("startTime");
    const endSelect = document.getElementById("endTime");
    for(let h=10; h<=20; h++) {
        ['00', '30'].forEach(m => {
            let timeStr = `${h.toString().padStart(2,'0')}:${m}`;
            if(!(h===20 && m==='30')) { startSelect.options.add(new Option(timeStr, timeStr)); }
        });
    }

    function autoSetEndTime() {
        const start = startSelect.value;
        if(!start) return;
        endSelect.innerHTML = '<option value="">-- 結束時間 --</option>';
        endSelect.disabled = false;
        let parts = start.split(":");
        let startHour = parseInt(parts[0], 10);
        let startMin = parseInt(parts[1], 10);
        let startTotalMins = startHour * 60 + startMin;
        for(let h=startHour; h<=22; h++) {
            ['00', '30'].forEach(m => {
                let thisTotalMins = h * 60 + parseInt(m, 10);
                if(thisTotalMins > startTotalMins) {
                    let timeStr = `${h.toString().padStart(2,'0')}:${m}`;
                    endSelect.options.add(new Option(timeStr, timeStr));
                }
            });
        }
        let defaultEndMins = startTotalMins + 120;
        let defaultEndHour = Math.floor(defaultEndMins / 60);
        let defaultEndMin = defaultEndMins % 60 === 0 ? "00" : "30";
        endSelect.value = `${defaultEndHour.toString().padStart(2,'0')}:${defaultEndMin}`;
        checkTimeValidation();
    }

    function checkTimeValidation() {
        if(currentAction === 'cancel') return true;
        const serviceType = document.getElementById("serviceType").value;
        const start = startSelect.value;
        const end = endSelect.value;
        if (!start || !end) return true;
        let startParts = start.split(":");
        let endParts = end.split(":");
        let startMins = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
        let endMins = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);
        let totalHours = (endMins - startMins) / 60;
        if (totalHours % 2 !== 0) {
            alert("單次預約為兩個小時, 一可預約兩場四個小時唷~感謝您");
            let defaultEndMins = startMins + 120;
            let defaultEndHour = Math.floor(defaultEndMins / 60);
            let defaultEndMin = defaultEndMins % 60 === 0 ? "00" : "30";
            endSelect.value = `${defaultEndHour.toString().padStart(2,'0')}:${defaultEndMin}`;
            return false;
        }
        if (serviceType === "除蹣+高溫(限定預約兩場以上)" && totalHours <= 2) {
            alert("提醒:若安排除蹣+高溫需安排兩場以上");
            document.getElementById("serviceType").value = "";
            return false;
        }
        return true;
    }
        const dateInput = document.getElementById("bookingDate");
    const today = new Date();
    const currentDay = today.getDate();
    dateInput.min = today.toISOString().split('T')[0];
    if (currentDay < 28) {
        let lastDayOfThisMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        dateInput.max = lastDayOfThisMonth.toISOString().split('T')[0];
    } else {
        let lastDayOfNextMonth = new Date(today.getFullYear(), today.getMonth() + 2, 0);
        dateInput.max = lastDayOfNextMonth.toISOString().split('T')[0];
    }

    function switchTab(action) {
        currentAction = action;
        document.getElementById("btn-book").classList.toggle("tab-active", action === 'book');
        document.getElementById("btn-cancel").classList.toggle("tab-active", action === 'cancel');
        document.getElementById("booking-fields").style.display = action === 'book' ? 'block' : 'none';
        document.getElementById("submitBtn").innerText = action === 'book' ? '🚀 送出預約申請' : '❌ 確認取消此場次';
        document.getElementById("lbl-name").innerText = action === 'book' ? '👤 客戶姓名 (需與系統登記一致) *' : '👤 取消人姓名 (需與原預約一致) *';
        document.getElementById("lbl-date").innerText = action === 'book' ? '📆 預約日期 *' : '📆 要取消的服務日期 *';
        document.getElementById("clientPhone").required = action === 'book';
        if(action === 'cancel') {
            document.getElementById("booking-fields").querySelectorAll('input, select').forEach(el => el.required = false);
            dateInput.max = "";
        } else {
            document.getElementById("clientCity").required = true;
            document.getElementById("clientDistrict").required = true;
            document.getElementById("startTime").required = true;
            document.getElementById("serviceType").required = true;
        }
    }

    function fetchStaff() {
        if(currentAction === 'cancel') return;
        const date = dateInput.value;
        if(!date) return;
        const staffSelect = document.getElementById("staffName");
        staffSelect.innerHTML = '<option value="">正在讀取當日排班名單...</option>';
        fetch(`${GAS_WEB_APP_URL}?date=${date}`)
            .then(res => res.json())
            .then(data => {
                if(data.error) { alert("讀取排班失敗: " + data.error); return; }
                
                if (data.length === 0) {
                    alert("提示:該日期所有時段預約已經滿囉!!!請更換其他日期預約!感謝您~");
                    dateInput.value = ""; 
                    staffSelect.innerHTML = '<option value="">-- 請先更換其他日期 --</option>'; 
                    return;
                }
                
                staffSelect.innerHTML = '<option value="不指定(由公司安排)">不指定(由公司安排)</option>';
                data.forEach(staff => { staffSelect.options.add(new Option(`${staff.name} (${staff.city})`, staff.name)); });
            })
            .catch(err => { staffSelect.innerHTML = '<option value="不指定(由公司安排)">不指定(由公司安排)(無法讀取)</option>'; });
    }

    document.getElementById("mainForm").addEventListener("submit", function(e) {
        e.preventDefault();
        if(currentAction === 'book' && !checkTimeValidation()) return;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "處理中，請稍後...";

        let selectedService = document.getElementById("serviceType").value;
        let userNote = document.getElementById("note").value;
        let finalCombinedNote = currentAction === 'book' ? `【${selectedService}】${userNote}` : userNote;

        let payload = {
            action: currentAction,
            clientName: document.getElementById("clientName").value,
            clientPhone: document.getElementById("clientPhone").value,
            serviceType: selectedService,
            bookingDate: document.getElementById("bookingDate").value,
            startTime: document.getElementById("startTime").value,
            endTime: document.getElementById("endTime").value,
            staffName: document.getElementById("staffName").value,
            clientCity: document.getElementById("clientCity").value,
            clientDistrict: document.getElementById("clientDistrict").value,
            note: finalCombinedNote
        };

        fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(resData => {
            alert(resData.message);
            if(resData.status === "success") { document.getElementById("mainForm").reset(); if(currentAction === 'book') switchTab('book'); }
        })
        .catch(err => { alert("與後端連線發生錯誤，請確認網路或 GAS 部署網址！"); })
        .finally(() => { submitBtn.disabled = false; submitBtn.innerText = currentAction === 'book' ? '🚀 送出預約申請' : '❌ 確認取消此場次'; });
    });
</script>
</body>
</html>
